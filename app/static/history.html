<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Past interviews · Startup Interview</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script type="module" src="/static/history.js"></script>
  </head>
  <body>
    <main>
      <h1>Past <em>interviews</em></h1>
      <section aria-label="Interview history">
        <label for="saved-interview">Choose an interview</label>
        <select id="saved-interview" disabled></select>
        <button type="button" id="refresh-history">Refresh history</button>
        <p id="history-status" role="status">Loading interviews…</p>
        <article id="saved-detail" hidden>
          <h2 id="interview-title">Interview details</h2>
          <p id="saved-settings" class="note"></p>
          <div id="summary-panel" aria-labelledby="summary-heading" hidden>
            <p class="note">AI-generated summary</p>
            <h3 id="summary-heading">At a glance</h3>
            <p id="overview"></p>
            <dl id="highlights"></dl>
            <details id="summary-details">
              <summary>Full summary</summary>
              <dl id="summary-fields"></dl>
            </details>
          </div>
          <p id="summary-status" role="status"></p>
          <h3>Saved transcript</h3>
          <ol id="transcript" aria-label="Saved conversation in speaking order"></ol>
        </article>
      </section>
      <a href="/">Interview home</a>
    </main>
  </body>
</html>
